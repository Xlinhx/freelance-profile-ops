<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lĩnh — Portfolio</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect fill='%2318B977' width='32' height='32' rx='6'/><text x='16' y='22' text-anchor='middle' font-family='monospace' font-size='16' font-weight='bold' fill='white'>L</text></svg>">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --accent: #18B977;
            --accent-dark: #0d9f5c;
            --text: #1a1a1a;
            --text-muted: #666;
            --border: #e5e5e5;
            --bg: #fafafa;
        }
        
        html {
            scroll-behavior: smooth;
        }
        
        body {
            font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }
        
        a {
            text-decoration: none;
            color: inherit;
        }
        
        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 4rem;
            background: rgba(250, 250, 250, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }
        
        .nav-logo {
            font-size: 1.375rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.02em;
        }
        
        .nav-logo span {
            color: var(--accent);
        }
        
        .nav-links {
            display: flex;
            gap: 2.5rem;
            align-items: center;
        }
        
        .nav-links a {
            font-size: 0.9375rem;
            font-weight: 500;
            color: var(--text-muted);
            transition: color 0.2s;
        }
        
        .nav-links a:hover {
            color: var(--accent);
        }
        
        .nav-contact {
            background: var(--accent);
            color: white !important;
            padding: 0.625rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
        }
        
        .nav-contact:hover {
            background: var(--accent-dark);
            color: white !important;
        }
        
        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 8rem 4rem 4rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(24, 185, 119, 0.1);
            border: 1px solid var(--accent);
            padding: 0.5rem 1rem;
            border-radius: 999px;
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 1.5rem;
            width: fit-content;
        }
        
        .badge-dot {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(24, 185, 119, 0.5); }
            50% { box-shadow: 0 0 0 8px rgba(24, 185, 119, 0); }
        }
        
        .hero-subtitle {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }
        
        .hero-name {
            font-size: 5rem;
            font-weight: 800;
            line-height: 1.05;
            margin-bottom: 1.5rem;
            letter-spacing: -0.03em;
        }
        
        .hero-tagline {
            font-size: 1.125rem;
            color: var(--text-muted);
            max-width: 480px;
            margin-bottom: 2.5rem;
        }
        
        .hero-cta {
            display: flex;
            gap: 1rem;
            margin-bottom: 3rem;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.875rem 1.75rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9375rem;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: var(--accent);
            color: white;
            box-shadow: 0 4px 14px rgba(24, 185, 119, 0.25);
        }
        
        .btn-primary:hover {
            background: var(--accent-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(24, 185, 119, 0.35);
        }
        
        .btn-secondary {
            background: var(--text);
            color: white;
        }
        
        .btn-secondary:hover {
            background: #333;
            transform: translateY(-2px);
        }
        
        .hero-stats {
            display: flex;
            gap: 3rem;
        }
        
        .stat {
            display: flex;
            flex-direction: column;
        }
        
        .stat-number {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--accent);
            line-height: 1;
            letter-spacing: -0.02em;
        }
        
        .stat-label {
            font-size: 0.8125rem;
            color: var(--text-muted);
            margin-top: 0.375rem;
        }
        
        /* Footer */
        footer {
            padding: 1.5rem 4rem;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .footer-logo {
            font-size: 1.125rem;
            font-weight: 700;
            color: var(--text);
        }
        
        .footer-logo span {
            color: var(--accent);
        }
        
        .footer-social {
            display: flex;
            gap: 0.75rem;
        }
        
        .footer-social a {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-muted);
            transition: all 0.2s;
        }
        
        .footer-social a:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        
        .footer-social svg {
            width: 18px;
            height: 18px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="#" class="nav-logo">Init<span>Forge</span></a>
        <div class="nav-links">
            <a href="#about">Về tôi</a>
            <a href="#skills">Kỹ năng</a>
            <a href="#projects">Dự án</a>
            <a href="#contact" class="nav-contact">Liên hệ</a>
        </div>
    </nav>
    
    <section class="hero">
        <div class="hero-badge">
            <span class="badge-dot"></span>
            <span>Đã triển khai AI vào thực tế</span>
        </div>
        
        <p class="hero-subtitle">Student @ HCMUS</p>
        <h1 class="hero-name">Lĩnh<span style="color: var(--accent);">.</span></h1>
        <p class="hero-tagline">Hành trình code từ hobby tới profession</p>
        
        <div class="hero-cta">
            <a href="#projects" class="btn btn-primary">
                Dự án của tôi
            </a>
            <a href="#" class="btn btn-secondary">
                Tải CV
            </a>
        </div>
        
        <div class="hero-stats">
            <div class="stat">
                <span class="stat-number">5+</span>
                <span class="stat-label">Dự án AI</span>
            </div>
            <div class="stat">
                <span class="stat-number">3+</span>
                <span class="stat-label">Năm kinh nghiệm</span>
            </div>
            <div class="stat">
                <span class="stat-number">1000+</span>
                <span class="stat-label">Giờ code</span>
            </div>
        </div>
    </section>
    
    <footer>
        <div class="footer-logo">Init<span>Forge</span></div>
        <div class="footer-social">

            </a>
            <a href="https://linkedin.com/in/linhnx-dev" title="LinkedIn">

            <a href="mailto:linhnx.developer@gmail.com" title="Email">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/></svg>
            </a>
        </div>
    </footer>
</body>
</html>
